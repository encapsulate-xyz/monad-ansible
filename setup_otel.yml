---
- name: Setup Otel
  hosts: all
  become: true
  gather_facts: true
  vars:
    project: "{{ group_names[0] }}"
    node_service_identifier: "{{ project }}{{ '' if type == 'validator' else '-' + type }}"
    system_architecture: "{{ architecture_map[ansible_architecture] | default(ansible_architecture) }}"
  vars_files:
    - group_vars/all.yml
    - group_vars/default.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  tasks:
    - name: Set service_identifier
      ansible.builtin.set_fact:
        service_identifier: "{{ node_service_identifier }}-{{ otel.service_identifier_suffix }}"

    - name: Include common handlers
      ansible.builtin.include_role:
        name: common
    - name: Include otel role
      ansible.builtin.include_role:
        name: otel
        public: true

  post_tasks:
    - name: Verify otel
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ otel_log_file_path }}"
            version_command: "{{ otel_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ otel.version }}"
            health_url: "http://localhost:{{ otel.ports.prometheus_metrics_exporter_port }}/metrics"
