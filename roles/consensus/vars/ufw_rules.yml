---
consensus_ufw_rules:
  validator:
    - port: "{{ monad.validator.consensus.ports.p2p_port }}"
      proto: tcp
      rule: allow
      from: any
      comment: p2p

    - port: "{{ monad.validator.consensus.ports.p2p_port }}"
      proto: udp
      rule: allow
      from: any
      comment: p2p

    - port: "{{ monad.validator.consensus.ports.auth_udp_port }}"
      proto: udp
      rule: allow
      from: any
      comment: auth_udp_port

    - port: "{{ monad.validator.consensus.ports.metrics_port }}"
      proto: tcp
      rule: allow
      from: 84.32.32.227
      comment: metrics_port

    - port: "{{ monad.validator.consensus.ports.metrics_port }}"
      proto: tcp
      rule: allow
      from: "{{ monitor_server_dns }}"
      comment: metrics_port

  fullnode:
    - port: "{{ monad.fullnode.consensus.ports.p2p_port }}"
      proto: tcp
      rule: allow
      from: any
      comment: p2p

    - port: "{{ monad.fullnode.consensus.ports.p2p_port }}"
      proto: udp
      rule: allow
      from: any
      comment: p2p
